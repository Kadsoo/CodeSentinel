name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Run mechanism demo
        run: npm run demo:mechanisms
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build WebUI
        run: npm run web:build
